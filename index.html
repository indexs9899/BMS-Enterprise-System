<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BMS System">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://i.ibb.co/n81Xscjc/Gemini-Generated-Image-fmvnykfmvnykfmvn.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/n81Xscjc/Gemini-Generated-Image-fmvnykfmvnykfmvn.png">

  <title>BMS Enterprise System</title>

  <style>
    :root {
      --navy: #0b1220;
      --navy-soft: #172036;
      --indigo: #6366f1;
      --blue: #38bdf8;
      --white: #ffffff;
      --muted: #a8b3c7;
      --line: rgba(255, 255, 255, 0.12);
      --shadow: 0 32px 80px rgba(2, 6, 23, 0.42);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--navy);
      font-family: "IBM Plex Sans Thai", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    button { font: inherit; }

    #app-frame {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity .55s ease, transform .7s cubic-bezier(.16, 1, .3, 1);
    }

    #loader-container {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 18% 16%, rgba(99, 102, 241, .28), transparent 28%),
        radial-gradient(circle at 84% 78%, rgba(56, 189, 248, .18), transparent 32%),
        linear-gradient(145deg, #070b14 0%, #10192d 52%, #0b1220 100%);
      transition: opacity .55s ease, visibility .55s ease;
      isolation: isolate;
    }

    #loader-container::before,
    #loader-container::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(3px);
      border: 1px solid rgba(255, 255, 255, .06);
      animation: drift 10s ease-in-out infinite alternate;
    }

    #loader-container::before { top: -210px; right: -120px; }
    #loader-container::after { bottom: -270px; left: -90px; animation-delay: -5s; }

    @keyframes drift {
      to { transform: translate3d(24px, 18px, 0) scale(1.08); }
    }

    .loader-card {
      width: min(100%, 430px);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: rgba(255, 255, 255, .075);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 32px;
    }

    .logo-shell {
      flex: 0 0 auto;
      width: 108px;
      height: 108px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.04));
      box-shadow: 0 22px 52px rgba(99, 102, 241, .32);
    }

    .app-logo { width: 100%; height: 100%; object-fit: cover; border-radius: 22px; display: block; }
    .eyebrow { margin: 0 0 3px; color: #7dd3fc; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -.02em; }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

    .status-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .loading-text { color: #dce6f6; font-size: 14px; font-weight: 500; }
    #progress-value { color: #7dd3fc; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }

    .progress-bar {
      position: relative;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--indigo), var(--blue));
      box-shadow: 0 0 18px rgba(56, 189, 248, .35);
      transition: width .35s ease;
    }

    .progress-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      transform: translateX(-100%);
      animation: shimmer 1.8s infinite;
    }

    @keyframes shimmer { to { transform: translateX(100%); } }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .security { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .security svg { color: #34d399; }
    .version { color: #77839a; font-size: 11px; white-space: nowrap; }

    #retry-btn {
      display: none;
      width: 100%;
      margin-top: 18px;
      padding: 12px 18px;
      color: white;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      box-shadow: 0 12px 30px rgba(79, 70, 229, .3);
      cursor: pointer;
      font-weight: 600;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    #retry-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(79, 70, 229, .4); }
    #retry-btn:active { transform: translateY(0) scale(.98); }

    #fab-refresh {
      position: fixed;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 10;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      color: #334155;
      border: 1px solid rgba(15, 23, 42, .1);
      border-radius: 16px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 12px 30px rgba(15, 23, 42, .18);
      backdrop-filter: blur(14px);
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    #fab-refresh:hover { transform: translateY(-3px) rotate(45deg); box-shadow: 0 18px 36px rgba(15, 23, 42, .24); }

    #network-toast {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 32px);
      padding: 11px 16px;
      color: white;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      background: rgba(220, 38, 38, .93);
      box-shadow: 0 16px 35px rgba(127, 29, 29, .28);
      backdrop-filter: blur(12px);
      transform: translate(-50%, calc(-100% - 40px));
      opacity: 0;
      pointer-events: none;
      transition: transform .4s cubic-bezier(.16,1,.3,1), opacity .3s ease;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    #network-toast.show { transform: translate(-50%, 0); opacity: 1; }
    #network-toast.online { background: rgba(5, 150, 105, .94); box-shadow: 0 16px 35px rgba(6, 78, 59, .25); }

    @media (max-width: 520px) {
      .loader-card { padding: 26px 22px; border-radius: 24px; }
      .brand-row { align-items: center; gap: 16px; margin-bottom: 28px; }
      .logo-shell { width: 88px; height: 88px; border-radius: 23px; }
      .app-logo { border-radius: 18px; }
      h1 { font-size: 19px; }
      .subtitle { font-size: 12px; }
      .card-footer { align-items: flex-start; flex-direction: column; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="network-toast" role="status" aria-live="polite">
    <span id="toast-icon" aria-hidden="true">!</span>
    <span id="toast-msg">ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้</span>
  </div>

  <div id="loader-container">
    <main class="loader-card" role="status" aria-live="polite">
      <div class="brand-row">
        <div class="logo-shell">
          <img src="https://i.ibb.co/n81Xscjc/Gemini-Generated-Image-fmvnykfmvnykfmvn.png" alt="โลโก้ BMS" class="app-logo">
        </div>
        <div>
          <p class="eyebrow">ฺBMS Platform</p>
          <h1>BMS Enterprise System</h1>
          <p class="subtitle">ระบบบริหารจัดการการจองที่พัก และ งบประมาณ</p>
        </div>
      </div>

      <div class="status-line">
        <span class="loading-text" id="loading-msg">กำลังเตรียมระบบ...</span>
        <span id="progress-value">0%</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar" id="p-bar"></div>
      </div>

      <button id="retry-btn" type="button" onclick="reloadApp()">ลองเชื่อมต่ออีกครั้ง</button>

      <div class="card-footer">
        <span class="security">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 10V7a5 5 0 0 1 10 0v3M6 10h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          เชื่อมต่ออย่างปลอดภัยผ่าน Google
        </span>
        <span class="version">Version 5.2</span>
      </div>
    </main>
  </div>

  <iframe
    src="https://script.google.com/macros/s/AKfycbwkAEHtXKfWjkV0I873RynWYNgOzKls9_7B8zW7XD0Ok36TvGhFljmpaShB6uG6uzjN6A/exec"
    allowfullscreen
    title="BMS Enterprise System"
    id="app-frame">
  </iframe>

  <button id="fab-refresh" type="button" onclick="reloadApp()" title="รีเฟรชระบบ" aria-label="รีเฟรชระบบ">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20 6v5h-5M4 18v-5h5M5.7 9A7 7 0 0 1 18.4 7.2L20 11M4 13l1.6 3.8A7 7 0 0 0 18.3 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <script>
    let progress = 0;
    let isLoaded = false;
    let loadingInterval;
    let timeoutTimer;
    let toastTimer;

    const pBar = document.getElementById('p-bar');
    const progressValue = document.getElementById('progress-value');
    const loadingMessage = document.getElementById('loading-msg');
    const retryButton = document.getElementById('retry-btn');
    const iframe = document.getElementById('app-frame');
    const loader = document.getElementById('loader-container');
    const toast = document.getElementById('network-toast');
    const toastMessage = document.getElementById('toast-msg');
    const toastIcon = document.getElementById('toast-icon');

    function setProgress(value, message) {
      progress = value;
      pBar.style.width = `${value}%`;
      progressValue.textContent = `${value}%`;
      loadingMessage.textContent = message;
    }

    function startLoadingProcess() {
      clearInterval(loadingInterval);
      clearTimeout(timeoutTimer);
      isLoaded = false;
      retryButton.style.display = 'none';
      setProgress(0, 'กำลังเตรียมระบบ...');

      loadingInterval = setInterval(() => {
        if (isLoaded) return;
        const next = Math.min(progress + Math.floor(Math.random() * 7) + 3, 90);
        const message = next < 35
          ? 'กำลังตรวจสอบการเชื่อมต่อ...'
          : next < 70
            ? 'กำลังเชื่อมต่อฐานข้อมูล...'
            : 'กำลังเตรียมพื้นที่ทำงาน...';
        setProgress(next, message);
      }, 420);

      timeoutTimer = setTimeout(() => {
        if (!isLoaded) {
          loadingMessage.textContent = 'การเชื่อมต่อใช้เวลานานกว่าปกติ';
          retryButton.style.display = 'block';
        }
      }, 12000);
    }

    iframe.addEventListener('load', function () {
      isLoaded = true;
      clearInterval(loadingInterval);
      clearTimeout(timeoutTimer);
      setProgress(100, 'พร้อมใช้งาน');

      setTimeout(() => {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        iframe.style.opacity = '1';
        iframe.style.transform = 'scale(1)';
      }, 450);
    });

    function reloadApp() {
      loader.style.visibility = 'visible';
      loader.style.opacity = '1';
      iframe.style.opacity = '0';
      iframe.style.transform = 'scale(.985)';
      iframe.src = iframe.src;
      startLoadingProcess();
    }

    function showNetworkToast(message, online) {
      clearTimeout(toastTimer);
      toast.className = online ? 'show online' : 'show';
      toastIcon.textContent = online ? '✓' : '!';
      toastMessage.textContent = message;

      if (online) {
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
      }
    }

    window.addEventListener('offline', () => {
      showNetworkToast('ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้', false);
    });

    window.addEventListener('online', () => {
      showNetworkToast('กลับมาออนไลน์แล้ว', true);
    });

    if (!navigator.onLine) {
      showNetworkToast('ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้', false);
    }

    startLoadingProcess();
  </script>
</body>
</html>
