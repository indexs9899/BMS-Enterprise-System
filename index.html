<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#312e81">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BMS System">
  <title>BMS Enterprise System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://i.ibb.co/YTd57khk/Gemini-Generated-Image-fmvnykfmvnykfmvn.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/YTd57khk/Gemini-Generated-Image-fmvnykfmvnykfmvn.png">

  <style>
    :root {
      --app-height: 100dvh;
      --indigo-950: #1e1b4b;
      --indigo-700: #4338ca;
      --indigo-600: #4f46e5;
      --emerald-600: #059669;
      --emerald-500: #10b981;
      --muted: #64748b;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: var(--app-height);
      min-height: var(--app-height);
      margin: 0;
      overflow: hidden;
      background: #eef2ff;
      color: #172033;
      font-family: "IBM Plex Sans Thai", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 84% 12%, rgba(16, 185, 129, .24), transparent 30%),
        radial-gradient(circle at 12% 88%, rgba(79, 70, 229, .22), transparent 34%),
        linear-gradient(145deg, #e0e7ff 0%, #f8fafc 50%, #d1fae5 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: min(70vw, 420px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
    }

    body::before { top: -25%; right: -24%; background: rgba(16, 185, 129, .18); }
    body::after { bottom: -30%; left: -22%; background: rgba(79, 70, 229, .17); }

    .launch-card {
      position: relative;
      z-index: 1;
      width: min(100%, 410px);
      max-height: calc(var(--app-height) - 36px);
      overflow-y: auto;
      padding: clamp(26px, 7vw, 38px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .88);
      border-radius: 30px;
      background: rgba(255, 255, 255, .66);
      box-shadow: 0 26px 75px rgba(49, 46, 129, .16);
      backdrop-filter: blur(22px) saturate(135%);
      -webkit-backdrop-filter: blur(22px) saturate(135%);
    }

    .logo-shell {
      width: 144px;
      height: 144px;
      margin: 0 auto 24px;
      padding: 6px;
      overflow: hidden;
      border: 1px solid rgba(99, 102, 241, .14);
      border-radius: 32px;
      background: #fff;
      box-shadow: 0 18px 42px rgba(49, 46, 129, .16);
    }

    .logo-shell img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 26px;
      transform: scale(1.08);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--indigo-700);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .subtitle { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .status { display: flex; justify-content: space-between; gap: 14px; margin: 28px 0 10px; color: #475569; font-size: 13px; font-weight: 600; }
    #progress-value { color: var(--emerald-600); font-variant-numeric: tabular-nums; }
    .track { height: 9px; overflow: hidden; border-radius: 999px; background: rgba(99, 102, 241, .11); }

    #progress {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--indigo-600), var(--indigo-700) 55%, var(--emerald-500));
      box-shadow: 0 0 18px rgba(16, 185, 129, .24);
      transition: width .2s ease;
    }

    #open-button {
      display: none;
      width: 100%;
      margin-top: 22px;
      padding: 13px 18px;
      color: #fff;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(110deg, var(--indigo-600), var(--indigo-700) 55%, var(--emerald-600));
      box-shadow: 0 12px 28px rgba(49, 46, 129, .22);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .security { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 22px; color: #94a3b8; font-size: 11px; }
    .security svg { color: var(--emerald-500); }

    @media (max-width: 420px) {
      .launch-card { border-radius: 24px; }
      .logo-shell { width: 128px; height: 128px; border-radius: 28px; }
      .logo-shell img { border-radius: 22px; }
    }

    @media (max-height: 620px) {
      .launch-card { padding-top: 20px; padding-bottom: 20px; }
      .logo-shell { width: 104px; height: 104px; margin-bottom: 16px; }
      .status { margin-top: 18px; }
      .security { margin-top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="launch-card" role="status" aria-live="polite">
    <div class="logo-shell">
      <img src="https://i.ibb.co/YTd57khk/Gemini-Generated-Image-fmvnykfmvnykfmvn.png" alt="โลโก้ BMS">
    </div>

    <p class="eyebrow">BMS Platform</p>
    <p class="subtitle">ระบบบริหารจัดการการจองที่พักและงบประมาณ</p>

    <div class="status">
      <span id="status-text">กำลังเปิดระบบ...</span>
      <span id="progress-value">0%</span>
    </div>
    <div class="track" aria-hidden="true"><div id="progress"></div></div>

    <button id="open-button" type="button">เปิดระบบ BMS</button>

    <div class="security">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 10V7a5 5 0 0 1 10 0v3M6 10h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      เชื่อมต่ออย่างปลอดภัยผ่าน Google
    </div>
  </main>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbwkAEHtXKfWjkV0I873RynWYNgOzKls9_7B8zW7XD0Ok36TvGhFljmpaShB6uG6uzjN6A/exec";
    const progressBar = document.getElementById("progress");
    const progressValue = document.getElementById("progress-value");
    const statusText = document.getElementById("status-text");
    const openButton = document.getElementById("open-button");
    let viewportFrame;
    let progress = 0;
    let redirectTimer;

    function syncViewportHeight() {
      const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty("--app-height", Math.round(height) + "px");
    }

    function scheduleViewportSync() {
      cancelAnimationFrame(viewportFrame);
      viewportFrame = requestAnimationFrame(syncViewportHeight);
    }

    function setProgress(value, message) {
      progress = value;
      progressBar.style.width = value + "%";
      progressValue.textContent = value + "%";
      if (message) statusText.textContent = message;
    }

    function openApp() {
      clearTimeout(redirectTimer);
      if (!navigator.onLine) {
        setProgress(progress, "ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้");
        openButton.style.display = "block";
        return;
      }
      setProgress(100, "พร้อมใช้งาน");
      redirectTimer = setTimeout(function () { window.location.replace(APP_URL); }, 250);
    }

    function start() {
      syncViewportHeight();
      setProgress(18, "กำลังตรวจสอบการเชื่อมต่อ...");
      setTimeout(function () { setProgress(58, "กำลังเตรียมระบบ..."); }, 180);
      setTimeout(function () { setProgress(88, "กำลังเปิดพื้นที่ทำงาน..."); }, 420);
      setTimeout(openApp, 720);
    }

    openButton.addEventListener("click", openApp);
    window.addEventListener("resize", scheduleViewportSync, { passive: true });
    window.addEventListener("orientationchange", function () { setTimeout(syncViewportHeight, 120); }, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleViewportSync, { passive: true });
    window.addEventListener("online", openApp);
    window.addEventListener("offline", function () {
      clearTimeout(redirectTimer);
      setProgress(progress, "ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้");
      openButton.style.display = "block";
    });

    start();
  </script>
</body>
</html>
